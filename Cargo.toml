[workspace]
resolver = "2"
members = ["crates/ccdu", "crates/ccdu-core", "crates/ccdu-remote", "crates/ccdu-tui"]

[workspace.package]
version = "0.1.1"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/lemehmet/ccdu"
homepage = "https://github.com/lemehmet/ccdu"
authors = ["ccdu contributors"]
keywords = ["disk-usage", "tui", "ncdu", "cleanup", "duplicates"]
categories = ["command-line-utilities", "filesystem"]

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
# Symbols are of no use in a shipped binary, and dropping them takes it from 4.6M to 3.0M.
# Build paths are handled separately, in the release workflow: Cargo's own `trim-paths` is still
# unstable, so the equivalent is passed through RUSTFLAGS where the environment is known.
strip = true
