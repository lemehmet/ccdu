name: Feature request
description: Something ccdu should be able to do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: >-
        The situation, rather than the feature. Knowing what you were trying to achieve usually
        leads somewhere better than the first solution either of us thinks of.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you have in mind
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What you tried instead
      description: Existing flags, other tools, or the manual workaround you are using now.
