name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build, for a dry run
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-13, target: x86_64-apple-darwin }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      # A shipped binary should not carry the path it was built from. Without this, every panic
      # location in the program and its dependencies embeds the builder's home directory — 98 of
      # them in the first release build that was checked. Cargo's own `trim-paths` would do this,
      # but it is still unstable, so the flags are passed here where the environment is known.
      - name: Build
        run: cargo build --release --target ${{ matrix.target }} --bin ccdu
        env:
          RUSTFLAGS: >-
            --remap-path-prefix=${{ github.workspace }}=/ccdu
            --remap-path-prefix=${{ runner.temp }}=/tmp
            --remap-path-prefix=/Users/runner=/build
            --remap-path-prefix=/home/runner=/build

      - name: Confirm no build paths survived
        run: |
          binary=target/${{ matrix.target }}/release/ccdu
          if strings -a "$binary" | grep -E '/(home|Users)/runner'; then
            echo "::error::the binary carries the build machine's paths"
            exit 1
          fi

      # Built natively on each platform rather than cross-compiled: ccdu is a program made almost
      # entirely of syscalls, and the version that ships should be the one the tests ran against.
      - name: Check it runs
        run: |
          ./target/${{ matrix.target }}/release/ccdu --version
          ./target/${{ matrix.target }}/release/ccdu scan --top 3 .

      - name: Package
        run: |
          name="ccdu-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp target/${{ matrix.target }}/release/ccdu "dist/$name/"
          cp README.md LICENSE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          shasum -a 256 "dist/$name.tar.gz" > "dist/$name.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ccdu-${{ matrix.target }}
          path: dist/*.tar.gz*

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
