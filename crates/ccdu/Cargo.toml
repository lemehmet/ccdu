[package]
name = "ccdu"
description = "Staged, resumable terminal disk-usage analyzer and cleaner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "ccdu"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
ccdu-core = { path = "../ccdu-core" }
ccdu-tui = { path = "../ccdu-tui" }
clap = { version = "4.6.5", features = ["derive"] }
crossbeam-channel = "0.5.16"
libc = "0.2.189"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
